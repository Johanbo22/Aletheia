name: Build and Release Aletheia

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: Aletheia-Windows-x64.zip
            asset_path: ./Aletheia-Windows-x64.zip
          - os: macos-latest
            artifact_name: Aletheia-macOS-x64.tar.gz
            asset_path: Aletheia-macOS-x64.tar.gz
          - os: ubuntu-latest
            artifact_name: Aletheia-Linux-x64.tar.gz
            asset_path: ./Aletheia-Linux-x64.tar.gz

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync Dependencies
        run: uv sync

      - name: Build Executable with PyInstaller
        run: uv run pyinstaller Aletheia.spec --clean

      - name: Compress Build (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist\Aletheia -DestinationPath ${{ matrix.artifact_name }}

      - name: Compress Build (macOS / Linux)
        if: runner.os != 'Windows'
        run: tar -czvf ${{ matrix.artifact_name }} -C dist Aletheia

      - name: Extract Release Notes from CHANGELOG
        shell: bash
        run: awk '/^## / { if (p) exit; p=1; next } p' CHANGELOG.md > release_notes.md

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_path }}
          body_path: release_notes.md
